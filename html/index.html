<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynk - Feed</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>
    <header>
        <img src="../images/icon.png" alt="">

        <span id="usernamePicture"></span>
        <span id="headerUsername"></span>
        <input type="button" value="Sair" id="logoutButton">
    </header>

    <aside id="profileInfo">
        <div id="profileInfoDiv"></div>
    </aside>

    <main>
        <div id="upperPostDiv">

            <div id="picturePic"></div>
            <textarea id="message" name="message" rows="5" cols="33" placeholder="O que você está pensando?"></textarea>

            <input type="text" id="imageUrl" placeholder="Cole o link da imagem (https://...)" hidden>

             <div id="postButtons">
            <button type="button" id="addImageButton">+</button>
            <button type="button" id="upperPostButton">Publicar</button>
    </div>
        </div>

        <div id="postsFetchDiv"></div>
    </main>

    <script src="../js/auth.js"></script>
    <script src="../js/protect.js"></script>
    <script src="../js/posts.js"></script>
</body>
</html>
