<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div id="IconDiv">
        <img src="../images/icon.png" alt="" id="icon">
    </div>

    <form action="" id="signUpForm">
        <h2>Cadastrar</h2>
        <p>Insira um e-mail, um nome de usuário e uma senha.</p>
        <label for="signUpInputEmail">E-mail</label>
        <input type="email" name="email" id="signUpInputEmail" required placeholder="nome@email.com">

        <label for="signUpInputUsername">Nome de usuário</label>
        <input type="text" name="name" id="signUpInputUsername" required placeholder="Seu nome de usuário">

        <label for="signUpInputPassword">Senha</label>
        <input type="password" name="password" id="signUpInputPassword" required placeholder="Sua senha">

        <input type="submit" value="Cadastrar">
        <p id="signUpError" class="form-error"></p> 
    </form>

    <div id="signInDiv">Já tem um usuário? <a href="./index.html" target="_self" id="sign_in_link">Entrar</a></div>


    <script src="../js/login.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
